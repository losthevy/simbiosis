version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: simbiosis-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: simbiosis
      POSTGRES_PASSWORD: simbiosis_dev_password
      POSTGRES_DB: simbiosis_db
    volumes:
      - simbiosis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simbiosis -d simbiosis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  simbiosis_postgres_data:
    driver: local
